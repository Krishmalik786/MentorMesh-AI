services:
  - type: web
    name: mentormesh-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install chromium && alembic upgrade head"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
